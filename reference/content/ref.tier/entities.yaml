  # Storage module: 2x2, +300 units per resource and +20 units/min throughput,
  # 10 credits/min.
  - id: ref.tier.entity.storage_module
    includes: [ref.tier.template.networked]
    components:
      placement:
        footprint: [2, 2]
      storage_provider:
        inventory: location.shared
        capacity:
          per_resource: 1800000
        throughput: 2000
      maintenance:
        interval_ticks: 60
        inputs:
          - { resource: ref.tier.resource.credits, quantity: 60000 }
        charge_policy: while_enabled
        shortage_policy: owner_deficit_policy

  # Coverage service: 4x4, radius 18, 45 credits/min; supplies B3.
  - id: ref.tier.entity.coverage_service
    includes: [ref.tier.template.networked]
    components:
      placement:
        footprint: [4, 4]
      service_provider:
        mode: coverage
        service: ref.tier.service.b3
        relation: { type: radius, cells: 18 }
      maintenance:
        interval_ticks: 60
        inputs:
          - { resource: ref.tier.resource.credits, quantity: 270000 }
        charge_policy: while_enabled
        shortage_policy: owner_deficit_policy

  # Residences: 3x3, no maintenance. S1 capacity 10; S2 capacity 20. An S2
  # residence only arises from advancement, so it has no placement of its own.
  # Both decay at zero population (B.6).
  - id: ref.tier.entity.residence_s1
    includes: [ref.tier.template.residence]
    components:
      placement:
        footprint: [3, 3]
      residence:
        population_tier: ref.tier.population.s1
        capacity: 10
        initial_population: 1
        growth_policy: ref.tier.growth.default
        empty_residence: { policy: decay, delay_ticks: 0 }
  - id: ref.tier.entity.residence_s2
