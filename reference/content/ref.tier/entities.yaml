      producer:
        recipes: [ref.tier.recipe.refine_bm2]
        process_slots: 1
        input_inventory: location.shared
        output_inventory: location.shared

  # Combiners: 4x4, 2-3 inputs -> 2 C/min, 25 AK2; unlocked at 150 S1.
  - id: ref.tier.entity.combiner_c1
