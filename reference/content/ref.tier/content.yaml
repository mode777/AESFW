resources:
  - id: ref.tier.resource.p1
    tags: [storable, ref.tier.role.primary]
    quantity: { precision: fixed, scale: 6000 }
    storage: { policy: normal, scope: inventory }
    transportable: true

  - id: ref.tier.resource.p2
    tags: [storable, ref.tier.role.primary]
    quantity: { precision: fixed, scale: 6000 }
    storage: { policy: normal, scope: inventory }
    transportable: true

  - id: ref.tier.resource.h1
    tags: [storable, ref.tier.role.intermediate]
    quantity: { precision: fixed, scale: 6000 }
    storage: { policy: normal, scope: inventory }
    transportable: true

  - id: ref.tier.resource.c1
    tags: [storable, ref.tier.role.consumer]
    complexity: 1
    quantity: { precision: fixed, scale: 6000 }
    storage: { policy: normal, scope: inventory }
    transportable: true

  - id: ref.tier.resource.bm1
    tags: [storable, ref.tier.role.construction]
    quantity: { precision: fixed, scale: 6000 }
    storage: { policy: normal, scope: inventory }
    transportable: true

  - id: ref.tier.resource.credits
    tags: [balance]
    quantity: { precision: fixed, scale: 6000 }
    storage: { policy: normal, scope: owner }
    transportable: false
    allow_negative: true

  - id: ref.tier.capability.s1
    tags: [virtual, capability]
    quantity: { precision: integer, scale: 1 }
    storage: { policy: recomputed, scope: location }
    transportable: false

location_templates:
  - id: ref.tier.location.a
    spatial_policy: framework.spatial.grid
    spatial_parameters:
      width: 40
      height: 40
      buildable_ratio: { min: 400, max: 700 }
    properties:
      ref.tier.property.suitability_p1: 1000
    source_slots:
      - { type: ref.tier.slot.v_a, count: 2 }
    internal_logistics:
      policy: framework.inventory.throughput_limited
      base_throughput: 6000
    inventories:
      - id: shared
        capacity: { mode: per_resource, quantity: 3000000 }
        access_policy: framework.inventory.shared_location
    activation: { initial: true }

recipes:
  - id: ref.tier.recipe.refine
    mode: batch
    duration_ticks: 30
    inputs:
      - { resource: ref.tier.resource.p1, quantity: 6000 }
      - { resource: ref.tier.resource.p2, quantity: 6000 }
    outputs:
      - { resource: ref.tier.resource.h1, quantity: 6000 }
    capability_requirements:
      - { resource: ref.tier.capability.s1, quantity: 1 }

  - id: ref.tier.recipe.combine
    mode: batch
    duration_ticks: 30
    inputs:
      - { resource: ref.tier.resource.h1, quantity: 12000 }
    outputs:
      - { resource: ref.tier.resource.c1, quantity: 6000 }
    capability_requirements:
      - { resource: ref.tier.capability.s1, quantity: 1 }

population_tiers:
  - id: ref.tier.population.s1
    consumption_factor: 1000
    need_categories: [ref.tier.need_category.b1]
    outputs:
      - resource: ref.tier.capability.s1
        scope: location
        rate_per_population_per_tick: 1
      - resource: ref.tier.resource.credits
        scope: owner
        rate_per_population_per_tick: 10
  - id: ref.tier.population.s2
    consumption_factor: 1000
    need_categories: [ref.tier.need_category.b2]
    outputs:
      - resource: ref.tier.resource.credits
        scope: owner
        rate_per_population_per_tick: 20

need_categories:
  - id: ref.tier.need_category.b1
    evaluation: { mode: all }
    members:
      - { need: ref.tier.need.c1, weight: 1000 }
  - id: ref.tier.need_category.b2
    evaluation: { mode: all }
    members:
      - { need: ref.tier.need.c2, weight: 1000 }

needs:
  - id: ref.tier.need.c1
    category: ref.tier.need_category.b1
    applies_to: [ref.tier.population.s1]
    demand:
      type: resource_consumption
      resource: ref.tier.resource.c1
      quantity_per_population_per_tick: 1
    fulfillment:
      measurement_window_ticks: 10
      target_ratio: 1000
  - id: ref.tier.need.c2
    category: ref.tier.need_category.b2
    applies_to: [ref.tier.population.s2]
    demand:
      type: resource_consumption
      resource: ref.tier.resource.c1
      quantity_per_population_per_tick: 2
    fulfillment:
      measurement_window_ticks: 10
      target_ratio: 1000

growth_policies:
  - id: ref.tier.growth.default
    interval_ticks: 10
    increase:
      quantity: 1
      condition: ref.tier.condition.grow

conditions:
  - id: ref.tier.condition.grow
    expression:
      greater_equal:
        left: { aggregate_need_fulfillment: current_entity }
        right: 800
  - id: ref.tier.condition.advance
    expression:
      greater_equal:
        left: { aggregate_need_fulfillment: current_entity }
        right: 800

satisfaction_bands:
  - id: ref.tier.bands.default
    bands:
      - min: 0
        effects: [{ type: 'enable_advancement' }]

transitions:
  - id: ref.tier.transition.s1_s2
    source_tier: ref.tier.population.s1
    target_tier: ref.tier.population.s2
    trigger: manual_command
    condition: ref.tier.condition.advance
    costs:
      - { resource: ref.tier.resource.credits, quantity: 1000 }
    cost_source: location_inventory
    cost_access_purpose: population_transition
    refund_policy: { policy: none }
    duration_ticks: 10
    conversion:
      population: retain_count_clamped
      entity_definition: ref.tier.entity.residence_s2
  - id: ref.tier.transition.s2_s1
    source_tier: ref.tier.population.s2
    target_tier: ref.tier.population.s1
    trigger: manual_command
    costs: []
    cost_source: location_inventory
    cost_access_purpose: population_transition
    refund_policy: { policy: none }
    duration_ticks: 10
    conversion:
      population: clamp_to_target_capacity
      entity_definition: ref.tier.entity.residence

entity_definitions:
  - id: ref.tier.entity.slot_extractor_p2
    components:
      maintenance:
        interval_ticks: 60
        inputs:
          - resource: ref.tier.resource.credits
            quantity: 6000
        charge_policy: while_enabled
        shortage_policy: owner_deficit_policy
      placement:
        footprint: [3, 3]
        requires_slot: ref.tier.slot.v_a
      resource_source:
        policy: slot_dependent
        depletion: none
        outputs:
          - { resource: ref.tier.resource.p2, quantity_per_tick: 400 }
      connectivity:
        requires: ref.tier.connectivity.hub_network
  - id: ref.tier.entity.area_extractor_p1
    components:
      maintenance:
        interval_ticks: 60
        inputs:
          - resource: ref.tier.resource.credits
            quantity: 6000
        charge_policy: while_enabled
        shortage_policy: owner_deficit_policy
      placement:
        footprint: [3, 3]
        working_area: { cells: 12, exclusive: true }
      resource_source:
        policy: area_dependent
        outputs:
          - { resource: ref.tier.resource.p1, quantity_per_tick: 400 }
        scale_by_property: ref.tier.property.suitability_p1
      connectivity:
        requires: ref.tier.connectivity.hub_network
  - id: ref.tier.entity.refiner
    components:
      maintenance:
        interval_ticks: 60
        inputs:
          - resource: ref.tier.resource.credits
            quantity: 6000
        charge_policy: while_enabled
        shortage_policy: owner_deficit_policy
      placement:
        footprint: [3, 3]
      producer:
        recipes: [ref.tier.recipe.refine]
        process_slots: 1
        input_inventory: location.shared
        output_inventory: location.shared
      connectivity:
        requires: ref.tier.connectivity.hub_network
  - id: ref.tier.entity.combiner
    components:
      maintenance:
        interval_ticks: 60
        inputs:
          - resource: ref.tier.resource.credits
            quantity: 6000
        charge_policy: while_enabled
        shortage_policy: owner_deficit_policy
      placement:
        footprint: [4, 4]
      producer:
        recipes: [ref.tier.recipe.combine]
        process_slots: 1
        input_inventory: location.shared
        output_inventory: location.shared
      connectivity:
        requires: ref.tier.connectivity.hub_network
  - id: ref.tier.entity.connector
    components:
      placement:
        footprint: [1, 1]
      connectivity:
        provides: ref.tier.connectivity.hub_network

  - id: ref.tier.entity.storage_module
    components:
      maintenance:
        interval_ticks: 60
        inputs:
          - resource: ref.tier.resource.credits
            quantity: 6000
        charge_policy: while_enabled
        shortage_policy: owner_deficit_policy
      placement:
        footprint: [2, 2]
      storage_provider:
        inventory: location.shared
        capacity:
          total: 1800000
        throughput: 2000
      connectivity:
        requires: ref.tier.connectivity.hub_network

  - id: ref.tier.entity.residence
    components:
      placement:
        footprint: [3, 3]
      residence:
        population_tier: ref.tier.population.s1
        capacity: 10
        initial_population: 1
        growth_policy: ref.tier.growth.default
  - id: ref.tier.entity.residence_s2
    components:
      placement:
        footprint: [3, 3]
      residence:
        population_tier: ref.tier.population.s2
        capacity: 10
        initial_population: 0
        growth_policy: ref.tier.growth.default
        empty_residence: { policy: retain }

  - id: ref.tier.entity.transport
    components: {}

connections:
  - id: ref.tier.connection.standard
    tags: [ref.tier.connection.transport]
    direction: bidirectional
    traversal:
      base_duration_ticks: 300
    allowed_transport_tags: [ref.tier.transport.standard]

regions:
  - id: ref.tier.region.core
    tags: [ref.tier.region.start]

transport_units:
  - id: ref.tier.transport.basic
    tags: [ref.tier.transport.standard]
    entity_definition: ref.tier.entity.transport
    cargo:
      compartment_policy: typed_slots
      slots: 2
      slot_capacity: 50000
      acceptance: transportable_resources
    movement:
      speed_permille: 1000
      allowed_connection_tags: [ref.tier.transport.standard]
    handling:
      loading_rate_per_tick: 10000
      unloading_rate_per_tick: 10000
    order_modes: [route]

transport_order_templates:
  - id: ref.tier.order.standard
    mode: route
    failure_policies:
      path_unavailable: retry
      cargo_cannot_unload: retain
    scheduling:
      repeat: true
      retry_interval_ticks: 20

worlds:
  - id: ref.tier.world.r2
    locations:
      - id: ref.tier.loc.a
        template: ref.tier.location.a
        region: ref.tier.region.core
      - id: ref.tier.loc.b
        template: ref.tier.location.a
        region: ref.tier.region.core
    connections:
      - id: ref.tier.conn.a_b
        definition: ref.tier.connection.standard
        origin: ref.tier.loc.a
        destination: ref.tier.loc.b
    owners:
      - id: owner.0
        established_locations: [ref.tier.loc.a, ref.tier.loc.b]
        initial_entities:
          - { definition: ref.tier.entity.area_extractor_p1, location: ref.tier.loc.a }
          - { definition: ref.tier.entity.refiner, location: ref.tier.loc.a }
          - { definition: ref.tier.entity.combiner, location: ref.tier.loc.a }
          - { definition: ref.tier.entity.connector, location: ref.tier.loc.a }
          - { definition: ref.tier.entity.storage_module, location: ref.tier.loc.a }
          - { definition: ref.tier.entity.residence, location: ref.tier.loc.a }
          - { definition: ref.tier.entity.residence_s2, location: ref.tier.loc.a }
          - { definition: ref.tier.entity.transport, location: ref.tier.loc.a }
          - { definition: ref.tier.entity.slot_extractor_p2, location: ref.tier.loc.b }
