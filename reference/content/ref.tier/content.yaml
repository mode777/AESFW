resources:
  - id: ref.tier.resource.p1
    tags: [storable]
    quantity: { precision: fixed, scale: 1000 }
    storage: { policy: normal, scope: inventory }
    transportable: true

  - id: ref.tier.resource.p2
    tags: [storable]
    quantity: { precision: fixed, scale: 1000 }
    storage: { policy: normal, scope: inventory }
    transportable: true

  - id: ref.tier.resource.h1
    tags: [storable]
    quantity: { precision: fixed, scale: 1000 }
    storage: { policy: normal, scope: inventory }
    transportable: true

  - id: ref.tier.resource.c1
    tags: [storable]
    quantity: { precision: fixed, scale: 1000 }
    storage: { policy: normal, scope: inventory }
    transportable: true

  - id: ref.tier.capability.s1
    tags: [virtual, capability]
    quantity: { precision: integer, scale: 1 }
    storage: { policy: recomputed, scope: location }
    transportable: false

location_templates:
  - id: ref.tier.location.a
    spatial_policy: framework.spatial.abstract_capacity
    spatial_parameters: { total_capacity: 100 }
    inventories:
      - id: shared
        capacity: { mode: total, quantity: 1000000 }
        access_policy: framework.inventory.shared_location
    activation: { initial: true }

recipes:
  - id: ref.tier.recipe.refine
    mode: batch
    duration_ticks: 20
    inputs:
      - { resource: ref.tier.resource.p1, quantity: 1000 }
      - { resource: ref.tier.resource.p2, quantity: 1000 }
    outputs:
      - { resource: ref.tier.resource.h1, quantity: 1000 }
    capability_requirements:
      - { resource: ref.tier.capability.s1, quantity: 1 }

  - id: ref.tier.recipe.combine
    mode: batch
    duration_ticks: 20
    inputs:
      - { resource: ref.tier.resource.h1, quantity: 1000 }
    outputs:
      - { resource: ref.tier.resource.c1, quantity: 1000 }
    capability_requirements:
      - { resource: ref.tier.capability.s1, quantity: 1 }

population_tiers:
  - id: ref.tier.population.s1
    consumption_factor: 1000
    need_categories: [ref.tier.need_category.b1]
    outputs:
      - resource: ref.tier.capability.s1
        scope: location
        rate_per_population_per_tick: 1

need_categories:
  - id: ref.tier.need_category.b1
    evaluation: { mode: all }
    members:
      - { need: ref.tier.need.c1, weight: 1000 }

needs:
  - id: ref.tier.need.c1
    category: ref.tier.need_category.b1
    applies_to: [ref.tier.population.s1]
    demand:
      type: resource_consumption
      resource: ref.tier.resource.c1
      quantity_per_population_per_tick: 1
    fulfillment:
      measurement_window_ticks: 10
      target_ratio: 1000

growth_policies:
  - id: ref.tier.growth.default
    interval_ticks: 10
    increase:
      quantity: 1
      condition: ref.tier.condition.grow

conditions:
  - id: ref.tier.condition.grow
    expression:
      greater_equal:
        left: { aggregate_need_fulfillment: current_entity }
        right: 800

entity_definitions:
  - id: ref.tier.entity.source_p1
    components:
      resource_source:
        policy: infinite_rate
        outputs:
          - { resource: ref.tier.resource.p1, quantity_per_tick: 1000 }

  - id: ref.tier.entity.source_p2
    components:
      resource_source:
        policy: infinite_rate
        outputs:
          - { resource: ref.tier.resource.p2, quantity_per_tick: 1000 }

  - id: ref.tier.entity.refiner
    components:
      producer:
        recipes: [ref.tier.recipe.refine]
        process_slots: 1
        input_inventory: location.shared
        output_inventory: location.shared

  - id: ref.tier.entity.combiner
    components:
      producer:
        recipes: [ref.tier.recipe.combine]
        process_slots: 1
        input_inventory: location.shared
        output_inventory: location.shared

  - id: ref.tier.entity.residence
    components:
      residence:
        population_tier: ref.tier.population.s1
        capacity: 10
        initial_population: 1
        growth_policy: ref.tier.growth.default
