# Population-threshold unlocks (01 Appendix B.3, B.7; GDD-19): the combiners,
# the coverage service, and the S1 -> S2 advancement unlock for the owner at
# 150 S1 population. Unlocks are not reversible.
unlocks:
  - id: ref.tier.unlock.s1_150
    scope: owner
    targets:
      - { type: entity_definition, id: ref.tier.entity.combiner_c1 }
      - { type: entity_definition, id: ref.tier.entity.combiner_c2 }
      - { type: entity_definition, id: ref.tier.entity.combiner_c3 }
      - { type: entity_definition, id: ref.tier.entity.combiner_c4 }
      - { type: entity_definition, id: ref.tier.entity.combiner_ep }
      - { type: entity_definition, id: ref.tier.entity.coverage_service }
      - { type: transition, id: ref.tier.transition.s1_s2 }
    condition: ref.tier.condition.s1_population_150
  - id: ref.tier.unlock.s2_400
    scope: owner
    targets:
      - { type: entity_definition, id: ref.tier.entity.advanced_combiner_c9 }
      - { type: entity_definition, id: ref.tier.entity.advanced_combiner_c10 }
      - { type: entity_definition, id: ref.tier.entity.advanced_combiner_c11 }
      - { type: entity_definition, id: ref.tier.entity.advanced_combiner_c12 }
      - { type: transition, id: ref.tier.transition.s2_s3 }
    condition: ref.tier.condition.s2_population_400
  - id: ref.tier.unlock.s3_900
    scope: owner
    targets:
      - { type: entity_definition, id: ref.tier.entity.coverage_service_s4 }
      - { type: transition, id: ref.tier.transition.s3_s4 }
    condition: ref.tier.condition.s3_population_900
