# Presentation mappings (04 §6, 07 §14.4). One entry per placeable definition:
# build-menu tab (`display.category_key`), ordering within the tab
# (`display.sort_order`), and the shape-grammar archetype of 07 §10.2
# (`visual.fallback_shape`). Definitions without an entry fall back to a plain
# square labelled with the ID's last segment (04 §6).
