# SCN-14: the reference prototype game, played by the 11.2 opening strategy
# (REF-8) for 7,200 ticks. Generated from `reference/content/test/balance`
# so the scenario and the strategy cannot drift apart; regenerate with
# `pnpm test --project reference-content generate`.
scenario:
  id: ref.tier.scenario.complete_game
  requirements: [SCN-14, GDD-23.4, GDD-23.5]
  content:
    packages: [reference/content/ref.tier]
  setup:
    seed: [1, 2]
    tick_duration_ms: 1000
    world: ref.tier.world.prototype
  commands:
    - tick: 1
      actor: owner.0
      type: PlaceEntityPlan
      payload:
        {
          'definition_id': 'ref.tier.entity.residence_s1',
          'location_id': 1,
          'logical_transform': { 'position': [27, 0], 'orientation': 0 },
        }
