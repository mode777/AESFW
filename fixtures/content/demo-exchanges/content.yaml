# Theme-free exchange fixture (roadmap 9.1).
resources:
  - id: demo.resource.credits
    tags: [balance]
    quantity: { precision: fixed, scale: 1000 }
    storage: { policy: normal, scope: owner }
    transportable: false
    allow_negative: true
  - id: demo.resource.trade_goods
    tags: [storable]
    quantity: { precision: fixed, scale: 1000 }
    storage: { policy: normal, scope: inventory }
    transportable: true

location_templates:
  - id: demo.location.port
    spatial_policy: framework.spatial.abstract_capacity
    spatial_parameters: { total_capacity: 100 }
    inventories:
      - id: shared
        capacity: { mode: total, quantity: 1000000 }
        access_policy: framework.inventory.shared_location
    activation: { initial: true }
  - id: demo.location.outpost
    spatial_policy: framework.spatial.abstract_capacity
    spatial_parameters: { total_capacity: 100 }
    inventories:
      - id: shared
        capacity: { mode: total, quantity: 1000000 }
        access_policy: framework.inventory.shared_location
    activation: { initial: true }

connections:
  - id: demo.connection.trade_route
    direction: bidirectional
    traversal: { base_duration_ticks: 1 }
    allowed_transport_tags: [demo.transport.standard]

exchanges:
  - id: demo.exchange.port
    location: demo.location.port
    currency: demo.resource.credits
    goods:
      - resource: demo.resource.trade_goods
        buy_from_exchange: { base_price: 12000, enabled: true }
        sell_to_exchange: { base_price: 8000, enabled: true }
    elasticity:
      window_ticks: 600
      step_quantity: 100000
      step_change_permille: 20
      recovery_permille_per_interval: 50
      recovery_interval_ticks: 60
      min_price_permille: 100
      max_price_permille: 5000
    shared_between_owners: true

entity_definitions:
  - id: demo.entity.trader
    components: {}

transport_units:
  - id: demo.transport.trader
    entity_definition: demo.entity.trader
    cargo:
      compartment_policy: unrestricted
      slots: 1
      slot_capacity: 1000
      acceptance: transportable_resources
    movement:
      speed_permille: 1000
      allowed_connection_tags: [demo.transport.standard]
    handling:
      loading_rate_per_tick: 100
      unloading_rate_per_tick: 100
    order_modes: [route, trade]

worlds:
  - id: demo.world.exchange
    locations:
      - id: demo.loc.port
        template: demo.location.port
      - id: demo.loc.outpost
        template: demo.location.outpost
    connections:
      - id: demo.conn.port_outpost
        definition: demo.connection.trade_route
        origin: demo.loc.port
        destination: demo.loc.outpost
    owners:
      - id: owner.a
        established_locations: [demo.loc.port]
