resources:
  - id: test.resource.a
    tags:
      - storable
    quantity:
      precision: fixed
      scale: 1000
    storage:
      policy: normal
      scope: inventory
    transportable: true
  - id: test.resource.b
    tags:
      - storable
    quantity:
      precision: fixed
      scale: 1000
    storage:
      policy: normal
      scope: inventory
    transportable: true
recipes:
  - id: test.recipe.long
    mode: batch
    duration_ticks: 1000
    inputs:
      - resource: test.resource.a
        quantity: 1000
    outputs:
      - resource: test.resource.b
        quantity: 1
  - id: test.recipe.eat
    mode: batch
    duration_ticks: 10
    inputs:
      - resource: test.resource.b
        quantity: 1000
    outputs: []
