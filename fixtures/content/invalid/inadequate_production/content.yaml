resources:
  - id: test.resource.food
    tags:
      - storable
    quantity:
      precision: fixed
      scale: 1000
    storage:
      policy: normal
      scope: inventory
    transportable: true
entity_definitions:
  - id: test.entity.farm
    components:
      resource_source:
        policy: infinite_rate
        outputs:
          - resource: test.resource.food
            quantity_per_tick: 2
needs:
  - id: test.need.food
    category: test.need_category.basic
    applies_to:
      - test.tier.a
    demand:
      type: resource_consumption
      resource: test.resource.food
      quantity_per_population_per_tick: 5
    fulfillment:
      measurement_window_ticks: 5
      target_ratio: 1000
need_categories:
  - id: test.need_category.basic
    evaluation:
      mode: all
    members:
      - need: test.need.food
        weight: 1000
population_tiers:
  - id: test.tier.a
    need_categories:
      - test.need_category.basic
    outputs: []
