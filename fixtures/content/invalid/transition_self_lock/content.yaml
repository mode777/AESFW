resources:
  - id: test.resource.luxury
    tags:
      - storable
    quantity:
      precision: fixed
      scale: 1000
    storage:
      policy: normal
      scope: inventory
    transportable: true
growth_policies:
  - id: test.growth.none
    interval_ticks: 10
population_tiers:
  - id: test.tier.1
    need_categories: []
    outputs: []
  - id: test.tier.2
    need_categories: []
    outputs:
      - resource: test.resource.luxury
        scope: location
        rate_per_population_per_tick: 1
transitions:
  - id: test.transition.locked
    source_tier: test.tier.1
    target_tier: test.tier.2
    duration_ticks: 5
    conversion:
      population: retain_count
    costs:
      - resource: test.resource.luxury
        quantity: 100
entity_definitions:
  - id: test.entity.residence
    components:
      residence:
        population_tier: test.tier.1
        capacity: 10
        growth_policy: test.growth.none
