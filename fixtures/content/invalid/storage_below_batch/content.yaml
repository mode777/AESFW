resources:
  - id: test.resource.a
    tags:
      - storable
    quantity:
      precision: fixed
      scale: 1000
    storage:
      policy: normal
      scope: inventory
    transportable: true
  - id: test.resource.out
    tags:
      - storable
    quantity:
      precision: fixed
      scale: 1000
    storage:
      policy: normal
      scope: inventory
    transportable: true
recipes:
  - id: test.recipe.big
    mode: batch
    duration_ticks: 10
    inputs:
      - resource: test.resource.a
        quantity: 5000
    outputs:
      - resource: test.resource.out
        quantity: 1000
entity_definitions:
  - id: test.entity.src
    components:
      resource_source:
        policy: infinite_rate
        outputs:
          - resource: test.resource.a
            quantity_per_tick: 100
  - id: test.entity.producer
    components:
      producer:
        recipes:
          - test.recipe.big
        process_slots: 1
        input_inventory: location.shared
        output_inventory: location.shared
location_templates:
  - id: test.location.a
    spatial_policy: framework.spatial.abstract_capacity
    spatial_parameters:
      total_capacity: 100
    inventories:
      - id: shared
        capacity:
          mode: total
          quantity: 1000
        access_policy: framework.inventory.shared_location
    activation:
      initial: true
