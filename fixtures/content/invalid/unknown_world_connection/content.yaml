location_templates:
  - id: test.location.a
    spatial_policy: framework.spatial.abstract_capacity
    spatial_parameters:
      total_capacity: 100
    inventories:
      - id: shared
        capacity:
          mode: total
          quantity: 1000
        access_policy: framework.inventory.shared_location
    activation:
      initial: true
worlds:
  - id: test.world
    locations:
      - id: test.loc.0
        template: test.location.a
    connections:
      - id: test.conn.0
        definition: test.connection.absent
        origin: test.loc.0
        destination: test.loc.0
